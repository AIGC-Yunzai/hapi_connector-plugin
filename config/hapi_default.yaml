# HAPI Connector for Yunzai

# HAPI 服务地址，例如 http://127.0.0.1:3006
hapi_endpoint: ""

# HAPI Access Token，支持 token:namespace
access_token: ""

# HTTP/HTTPS 代理地址
proxy_url: ""

# Cloudflare Access 凭据，可留空
cf_access_client_id: ""
cf_access_client_secret: ""

# JWT 有效期与提前刷新时间（秒）
jwt_lifetime: 900
refresh_before_expiry: 180

# 推送级别：detail / simple / collapsed / summary / silence
output_level: "simple"
summary_msg_count: 5

# 思考字数上限，仅 simple/detail 显示，0 关闭
reasoning_max_chars: 2000

# 回复格式：text 文字 / image 图片 / both 两者
markdown_output: "text"

# 图片主题：auto 自动 / light 浅色 / dark 深色
markdown_theme: "light"

# 展示会话权限、模型与思考强度
more_session_info: false

# 合并转发为单节点，超长时分隔
merge_forward_single_node: false

# 是否启用快捷发送
quick_send_enabled: true

# 快捷发送前缀，如 >消息 或 >{2} 消息
quick_prefix: ">"

# 群聊快捷发送是否必须 @Bot 才响应
quick_group_at_bot_only: false

# 待审批提醒与忙时托管审批
remind_pending: true
remind_interval: 180
remind_max_count: 3
enable_poke_approve: true
# 戳一戳动作：approve / pending / list / status / stop / output_cycle / none
poke_action: "approve"
auto_approve_enabled: false
auto_approve_start: "23:00"
auto_approve_end: "07:00"
max_reconnect_attempts: 30

# 是否随插件启动 SSE 监听
enable_sse: true

# 自动放行模式下先切 default 发送，3 秒后恢复
delay_yolo_mode: false

# 系统事件及合成报错重试关键词，大小写敏感
retry_error_strings:
  - "API Error: Request rejected"
  - "We’re currently experiencing high demand, which may cause temporary errors"
  - "Codex error: rate limit exceeded"
# 最大自动重试次数，0 关闭
retry_max_count: 10

# 自动重试等待时间（分钟）
retry_delay_minutes: 1
